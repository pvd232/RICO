schema_version = 1

[[requirements]]
id = "REQ-NATIVE"
claim = "The proposal gate retains its result."
phase = 0
order = 1
depends_on = []
gate = { kind = "test", target = "VR-NATIVE" }
verifier_ids = ["VR-NATIVE"]
pair_block_ids = ["PB-NATIVE"]

[[verifiers]]
id = "VR-NATIVE"
requirement_ids = ["REQ-NATIVE"]
conditions = ["The declared test command passes."]
success_case = "The receipt records the passing command."
rejection_cases = ["The command fails."]

[[pair_blocks]]
id = "PB-NATIVE"
requirement_ids = ["REQ-NATIVE"]
depends_on = []
section = "0A"
repository = "test"
source_paths = ["tools/pairblock_status/checklist_profile.py"]
test_paths = ["tests/pairblock_status/test_pairblock_controller.py"]

[pair_blocks.gate]
repository = "test"
working_directory = "."
argv = ["python", "-c", "print('2 passed in 0.01s')"]
environment = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" }
