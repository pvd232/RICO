  "tests/test_public_api.py",
  "tests/test_release_tools.py",
  "tests/test_documentation.py",
  "tests/test_workflow_documentation.py",
]

[[gate.steps]]
role = "documentation"
working_directory = "."
argv = [
  "python3",
  "/Users/machina/.agents/skills/code-documentation/scripts/check-schema-descriptions.py",
  "src/viper/gcs.py",
  "tests/test_gcs_storage.py",
]

[[gate.steps]]
