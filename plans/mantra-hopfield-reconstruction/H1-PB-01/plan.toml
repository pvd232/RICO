schema_version = 1
contract_id = "mantra-hopfield-reconstruction"
package_sha256 = "b4cd6852de4b931e9fb6f83f045fc06f0b025063c8e5e5d6b032d3658447baa3"
pair_block_id = "H1-PB-01"
baseline_commit = "e9d9a94977fed4ce2b9a85e08b4a82bae2426a71"
change_summary = [
  "The MANTRA workspace now treats requirements as the checklist's long-term planning units and derives implementation ownership from PairBlocks.",
  "Phase 1 and Phase 2 now have producer-aligned requirements, verifiers, PairBlocks, and one preflighted plan for the first implementation change.",
  "The accepted Phase 0 result remains the immutable reconstruction oracle and is not executed again.",
]
deviation_summary = "The removed reverse requirement-to-PairBlock links made the old bootstrap package unreadable. This current-schema plan replaces that administrative boundary without rerunning Phase 0."

[[actions]]
operation = "patch"
patch_path = "patches/requirement-first-contract.patch"
target_paths = [
  "checklists/mantra-rebuild.md",
  "checklists/mantra-rebuild.toml",
  "contracts/mantra-graph-encoder-v1.toml",
  "contracts/mantra-hopfield-reconstruction.toml",
  "contracts/mantra-mil-reconstruction.toml",
  "docs/briefings/2026-09-15-mantra-phase-1-2-matrix-charter.md",
