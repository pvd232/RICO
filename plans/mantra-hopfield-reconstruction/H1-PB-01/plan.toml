  "plans/mantra-hopfield-reconstruction/H1-PB-02/patches/truth-perturbation-order.patch",
  "plans/mantra-hopfield-reconstruction/H1-PB-02/plan.toml",
  "tests/phase1/test_hopfield_contract.py",
]

[[handoff_targets]]
