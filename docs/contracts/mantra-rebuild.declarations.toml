[[verifiers]]
id = "P0-VR-25"
requirement_ids = ["P0-REQ-26"]
conditions = [
  "The evaluation stage consumes both the replayed and historical prediction archives.",
  "Each archive contains the approved keys in order, with equal shapes, dtypes, and values.",
  "The receipt records the byte count and SHA-256 of both prediction archives.",
  "The parity decision requires both prediction-array parity and score parity.",
]
success_case = "Reproduce the historical prediction arrays and hold PearsonDelta exactly within the declared score tolerance."
rejection_cases = [
  "Produce a different prediction value while retaining the historical hold PearsonDelta.",
  "Change an array key, shape, or dtype.",
  "Change either prediction archive after its identity is recorded.",
]

[[verifiers]]
id = "P0-VR-27"
requirement_ids = ["P0-REQ-28"]
conditions = [
  "The lifecycle policy assigns one evidence rule to every executable event.",
  "The controller validates the evidence rule before it writes a receipt.",
]
success_case = "Approve, accept, and register each advance with the evidence assigned to that event."
rejection_cases = [
  "Approve with test evidence.",
  "Accept with unrelated external text.",
  "Register with an arbitrary command.",
]

[[verifiers]]
id = "P0-VR-28"
requirement_ids = ["P0-REQ-29"]
conditions = [
  "Native receipts reject unknown fields and invalid nested values.",
  "Gate receipts recompute the command, output, declaration, manifest, drift, and predecessor relationships.",
  "Receipts name both the declaration repository and the implementation repository when they differ.",
]
success_case = "An unchanged receipt produced by the declared gate advances its PairBlock."
rejection_cases = [
  "Replace the executed command or its digest.",
  "Remove the captured execution identities.",
  "Record the controller repository as the implementation repository.",
]

[[verifiers]]
id = "P0-VR-29"
requirement_ids = ["P0-REQ-30"]
conditions = [
  "plan-revision persists the candidate declaration digest and computed change.",
  "revise requires that exact plan and rejects a different candidate manifest.",
  "Live manifests and accepted snapshots share one exact schema-version check.",
]
success_case = "Accept the unchanged candidate named by a persisted reviewed plan."
rejection_cases = [
  "Change the candidate after planning.",
  "Load schema version 0, 2, or true from either declaration source.",
]

[[verifiers]]
id = "P0-VR-30"
requirement_ids = ["P0-REQ-31"]
conditions = [
  "The controller writes a recoverable prepared record before changing receipt-derived projections.",
  "A successful operation publishes its authoritative receipt after both projection files match the prepared bytes and the semantic validator accepts them.",
  "The next controller invocation completes an interrupted prepared transition idempotently.",
]
success_case = "Interrupt after each persistent write, retry, and obtain the same receipt, contract, and checklist bytes as an uninterrupted run."
rejection_cases = [
  "A receipt advances state while either rendered document still shows the predecessor.",
  "A retry rejects its own partially written projection.",
]

[[verifiers]]
id = "P0-VR-31"
requirement_ids = ["P0-REQ-32"]
conditions = [
  "Links escape Markdown control characters while preserving repository-relative targets and fragments.",
  "Each generated transition command begins in the controlling repository.",
]
success_case = "Render and resolve paths containing spaces, parentheses, a number sign, and a table delimiter."
rejection_cases = [
  "A rendered link resolves to a different file or fragment.",
  "A copied transition command depends on the operator's current directory.",
]

[[verifiers]]
id = "P0-VR-32"
requirement_ids = ["P0-REQ-33"]
conditions = [
  "Waiting-state derivation combines receipt-derived native statuses with parsed legacy statuses.",
  "An unresolved dependency produces the same displayed state and gate rejection regardless of declaration origin.",
  "The render command regenerates both human views from accepted declarations and receipts without changing lifecycle state.",
]
success_case = "Render a native block as waiting while its legacy dependency remains unresolved."
rejection_cases = [
  "Display a native block as Drafting while its legacy dependency remains in Review.",
  "Execute a native gate before its legacy dependency reaches Applied or Complete.",
]

[[verifiers]]
id = "P0-VR-33"
requirement_ids = ["P0-REQ-34"]
conditions = [
  "A profile that enables legacy certification declares one repository-relative terminal artifact path.",
  "The certification transition rejects every other artifact even when that artifact's SHA-256 is valid.",
  "Completion validation rechecks both the declared artifact path and its byte identity.",
]
success_case = "Certify a named legacy PairBlock with evidence/phase0/rico/phase0_registration_receipt.json and that file's SHA-256."
rejection_cases = [
  "Certify with a different repository artifact and its valid SHA-256.",
  "Change the configured terminal artifact after certification.",
]

[[verifiers]]
id = "P0-VR-34"
requirement_ids = ["P0-REQ-35"]
conditions = [
  "A multi-artifact restore joins the destination directory to each frozen output path.",
  "The restore planner rejects declared paths that overlap beneath the destination.",
  "The Hopfield stages expose typed raw-gene prediction, attention-summary, and parity-receipt outputs.",
  "The Hopfield runner restores its selected outputs with one execution.restore call and repeats no output filename.",
]
success_case = "Restore the raw-gene predictions and parity receipt to their declared filenames beneath the replay result directory."
rejection_cases = [
  "Derive a destination from VIPER's internal stored-at path.",
  "Repeat either output filename in the Hopfield runner.",
  "Issue one restore call per selected Hopfield artifact.",
]

