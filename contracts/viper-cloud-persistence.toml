id = "VC-PB-01"
requirement_ids = ["VC-REQ-01", "VC-REQ-02"]
depends_on = []
repository_id = "viper"
requirement_contribution = "Persist, return, reload, and verify one cloud-backed terminal run reference."
completion_evidence = ["implementation_review", "viper_registration"]

