schema_version = 1
contract_id = "viper-cloud-persistence"
title = "VIPER Cloud Persistence"

[[requirements]]
id = "VC-REQ-01"
claim = "A successful run or retry using ViperCloudDestination must atomically save and publicly return the exact cloud-backed ResolvedRunRef created for terminal resolved.yaml."
depends_on = []
verifier_ids = ["VC-VR-01"]

[[requirements]]
id = "VC-REQ-02"
claim = "resolve_run_reference must prefer an adjacent saved cloud reference, require GcsFileRef or HuggingFaceFileRef storage, verify that its digest, byte count, and canonical path identify the terminal resolved.yaml, and reject any disagreement without rereading remote payload bytes."
depends_on = ["VC-REQ-01"]
verifier_ids = ["VC-VR-02"]

[[requirements]]
id = "VC-REQ-03"
claim = "An explicit producer-side promotion operation must verify a complete local run graph and return an equivalent cloud-rooted ResolvedRunRef without invoking any stage callable or mutating the source graph."
depends_on = []
verifier_ids = ["VC-VR-03"]

[[requirements]]
id = "VC-REQ-04"
claim = "Promotion must preserve scientific payload digests and byte counts, canonical workspace-relative paths, producer and input relationships, and any verified DownloadSpec-rooted lineage already present in the source graph; every rewritten protocol document must receive the identity of its new serialized bytes."
depends_on = ["VC-REQ-03"]
verifier_ids = ["VC-VR-04"]

[[requirements]]
id = "VC-REQ-05"
claim = "Workspace configuration must let a user select one GCS or Hugging Face repository; the public ViperCloud facade must own publication, sealing, copying, fetching, verification, and materialization and return that repository's provider-specific immutable file and snapshot refs; an internal ViperCloudProvider base class must implement shared manifest, identity, retry, and atomic-materialization behavior while provider subclasses implement only repository-specific I/O."
depends_on = []
verifier_ids = ["VC-VR-05"]

[[requirements]]
id = "VC-REQ-06"
claim = "Public run, retry, restore, benchmark, and export operations must resolve ViperCloud internally, and the migration must remove MANTRA's provider loader, every application-level cloud_client injection, GCS-owned shared manifest logic, direct Hugging Face fetch dispatch outside ViperCloud, and blanket execution trust switches that are not derived from an immutable reference or verification receipt."
depends_on = ["VC-REQ-05"]
verifier_ids = ["VC-VR-06"]

[[requirements]]
id = "VC-REQ-07"
claim = "For both GCS and Hugging Face repositories, a fresh workspace with no producer path must materialize provider-specific immutable references through ViperCloud while consumer code receives only resolved references and verified local paths and no duplicate immutable payload is written beneath .viper/store."
depends_on = ["VC-REQ-01", "VC-REQ-02", "VC-REQ-03", "VC-REQ-04", "VC-REQ-05", "VC-REQ-06"]
verifier_ids = ["VC-VR-07"]

[[verifiers]]
id = "VC-VR-01"
requirement_ids = ["VC-REQ-01"]
acceptance_conditions = ["Cloud run and retry success records expose the same ResolvedRunRef returned by execution and save the same serialized reference beside terminal resolved.yaml; retry verifies the old reference before replacing it; an unverified replacement is rejected with RunError('terminal cloud reference differs')."]
success_case = { repository_id = "viper", path = "tests/test_run_execution.py", symbol = "test_cloud_native_run_returns_and_persists_one_terminal_reference" }
rejection_cases = [{ repository_id = "viper", path = "tests/test_storage.py", symbol = "test_terminal_reference_rejects_an_unverified_replacement" }]

[[verifiers]]
id = "VC-VR-02"
requirement_ids = ["VC-REQ-02"]
acceptance_conditions = ["Restart resolution loads a matching adjacent cloud sidecar without network I/O and rejects a non-cloud location or terminal identity mismatch with RestoreError('stored run reference differs from terminal identity')."]
success_case = { repository_id = "viper", path = "tests/test_storage.py", symbol = "test_resolve_run_reference_prefers_adjacent_cloud_pointer" }
rejection_cases = [{ repository_id = "viper", path = "tests/test_storage.py", symbol = "test_resolve_run_reference_rejects_stale_cloud_pointer" }]

[[verifiers]]
id = "VC-VR-03"
requirement_ids = ["VC-REQ-03"]
acceptance_conditions = ["Promotion verifies and publishes the reachable local graph, returns a cloud-rooted ResolvedRunRef, leaves source bytes unchanged, and records zero stage calls; missing or changed source bytes raise RunPromotionError('source run graph is unavailable')."]
success_case = { repository_id = "viper", path = "tests/test_run_execution.py", symbol = "test_explicit_cloud_promotion_preserves_local_run_mode" }
rejection_cases = [{ repository_id = "viper", path = "tests/test_run_execution.py", symbol = "test_explicit_cloud_promotion_rejects_missing_source_bytes" }]

[[verifiers]]
id = "VC-VR-04"
requirement_ids = ["VC-REQ-04"]
acceptance_conditions = ["The promoted graph retains scientific payload identities, canonical paths, producer and input relationships, and any verified DownloadSpec roots already present while rewritten protocol records match their new bytes; a source graph with missing immutable bytes is rejected before publication."]
success_case = { repository_id = "viper", path = "tests/test_run_execution.py", symbol = "test_explicit_cloud_promotion_preserves_local_run_mode" }
rejection_cases = [{ repository_id = "viper", path = "tests/test_run_execution.py", symbol = "test_explicit_cloud_promotion_rejects_missing_source_bytes" }]

[[verifiers]]
id = "VC-VR-05"
requirement_ids = ["VC-REQ-05"]
acceptance_conditions = ["The same ViperCloud operations publish and restore through a configured GCS repository and a configured Hugging Face repository, returning that repository's file and snapshot refs; both providers inherit shared invariants from ViperCloudProvider; an unsupported provider or invalid repository fails before publication."]
success_case = { repository_id = "viper", path = "tests/test_cloud_service.py", symbol = "test_fresh_workspace_materializes_each_provider_reference" }
rejection_cases = [{ repository_id = "viper", path = "tests/test_storage.py", symbol = "test_storage_settings_parse_local_and_cloud_destinations" }]

[[verifiers]]
id = "VC-VR-06"
requirement_ids = ["VC-REQ-06"]
acceptance_conditions = ["VIPER's public operations expose no cloud_client parameter; all provider dispatch and shared manifest behavior live behind ViperCloud; MANTRA rebuild modules contain no provider construction or injection; execution trust follows an immutable reference or receipt rather than a caller-selected Boolean."]
success_case = { repository_id = "viper", path = "tests/test_cloud_service.py", symbol = "test_public_execution_signatures_do_not_expose_provider_clients" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_cloud_boundary.py", symbol = "test_rebuild_rejects_provider_coupling" }]

[[verifiers]]
id = "VC-VR-07"
requirement_ids = ["VC-REQ-07"]
acceptance_conditions = ["For each configured provider, a fresh workspace materializes the provider-specific immutable reference to a verified local path and creates no duplicate immutable payload beneath .viper/store."]
success_case = { repository_id = "viper", path = "tests/test_cloud_service.py", symbol = "test_fresh_workspace_materializes_each_provider_reference" }
rejection_cases = [{ repository_id = "viper", path = "tests/test_prior_run_inputs.py", symbol = "test_cloud_pointer_rejects_a_local_producer" }]

