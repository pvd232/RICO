schema_version = 1
contract_id = "mantra-hopfield-reconstruction"
title = "MANTRA Hopfield Reconstruction"

[[requirements]]
id = "H1-REQ-01"
claim = "Phase 1 must begin from the selected Phase 0 Hopfield encoder SHA-256 2433527c3b23b66a16cedc0f7bc43867e4298af4d7a0733b202a8018ba876610, prediction SHA-256 d7180c4669a11b0b2fb184814aafb48ebafe75b02e4bd07998c337aa64dc59b7, and hold PearsonDelta 0.5861640938949398."
depends_on = []
verifier_ids = ["H1-VR-01"]

[[requirements]]
id = "H1-REQ-02"
claim = "Before any numerical comparison, training, or prediction, the selected Hopfield path must reject disagreement among the ordered perturbation labels for descriptor features, coefficient targets, and fit or tune truth rows."
depends_on = ["H1-REQ-01"]
verifier_ids = ["H1-VR-02"]

[[requirements]]
id = "H1-REQ-03"
claim = "The selected matched-control, control-program, core83, response40, family64, and gene-shift inputs must be rebuilt from their approved producers and match the retained historical files by keys, perturbation order, gene order, shape, dtype, and values."
depends_on = ["H1-REQ-02"]
verifier_ids = ["H1-VR-03"]

[[requirements]]
id = "H1-REQ-04"
claim = "The selected coefficient targets, fit and tune truth rows, response-block contract, response rotation, and response-similarity graph must be rebuilt from their approved producers and match the retained historical files by keys, row and column order, shape, dtype, and values."
depends_on = ["H1-REQ-03"]
verifier_ids = ["H1-VR-04"]

[[requirements]]
id = "H1-REQ-05"
claim = "The Hopfield loader must assemble the rebuilt inputs with the selected gene order, shapes, dtypes, and fit plus tune normalization population and reproduce every retained model input array."
depends_on = ["H1-REQ-04"]
verifier_ids = ["H1-VR-05"]

[[requirements]]
id = "H1-REQ-06"
claim = "The 187 to 384 to 384 to 128 Hopfield encoder must be trained under the selected historical objectives and seed and reproduce the retained weights while recording checkpoints, logs, selection scores, and the VIPER run."
depends_on = ["H1-REQ-05"]
verifier_ids = ["H1-VR-06"]

[[requirements]]
id = "H1-REQ-07"
claim = "Raw-gene retrieval from fit memory at temperature 0.055 and reference correction must reproduce prediction SHA-256 d7180c4669a11b0b2fb184814aafb48ebafe75b02e4bd07998c337aa64dc59b7 byte for byte and hold PearsonDelta 0.5861640938949398 exactly."
depends_on = ["H1-REQ-06"]
verifier_ids = ["H1-VR-07"]

[[requirements]]
id = "H1-REQ-08"
claim = "Every accepted Phase 1 producer, input, output, comparison, and implementation commit must remain reachable through retained VIPER and contract-protocol evidence."
depends_on = ["H1-REQ-07"]
verifier_ids = ["H1-VR-08"]

[[verifiers]]
id = "H1-VR-01"
requirement_ids = ["H1-REQ-01"]
acceptance_conditions = ["The typed Phase 1 contract names the selected score and exact prediction digest, and the retained Phase 0 index resolves the replay receipt."]
success_case = { repository_id = "rico", path = "tests/phase1/test_hopfield_contract.py", symbol = "HopfieldContractTests.test_names_selected_phase0_baseline" }
rejection_cases = [{ repository_id = "rico", path = "tests/phase1/test_hopfield_contract.py", symbol = "HopfieldContractTests.test_rejects_changed_prediction_identity" }]

[[verifiers]]
id = "H1-VR-02"
requirement_ids = ["H1-REQ-02"]
acceptance_conditions = ["The existing Hopfield loader accepts equal feature, coefficient-target, and truth perturbation labels and rejects a truth surface whose fit or tune labels are reordered."]
success_case = { repository_id = "mantra", path = "experiments/v1938_sota_clean_repro/tests/step01/test_hopfield_direct_family_contract.py", symbol = "test_accepts_matching_truth_perturbation_order" }
rejection_cases = [{ repository_id = "mantra", path = "experiments/v1938_sota_clean_repro/tests/step01/test_hopfield_direct_family_contract.py", symbol = "test_rejects_truth_perturbation_order_mismatch" }]

[[verifiers]]
id = "H1-VR-03"
requirement_ids = ["H1-REQ-03"]
acceptance_conditions = ["Each rebuilt descriptor-side input has the same NPZ keys, ordered perturbations and genes, shapes, dtypes, and arrays as its retained historical counterpart."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_rebuilds_selected_descriptor_inputs" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_rejects_changed_descriptor_input" }]

[[verifiers]]
id = "H1-VR-04"
requirement_ids = ["H1-REQ-04"]
acceptance_conditions = ["Each rebuilt target-side input has the same NPZ or JSON keys, ordered rows and columns, shapes, dtypes, and values as its retained historical counterpart."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_rebuilds_selected_target_inputs" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_rejects_changed_target_input" }]

[[verifiers]]
id = "H1-VR-05"
requirement_ids = ["H1-REQ-05"]
acceptance_conditions = ["The assembled model inputs reproduce every retained array and use fit plus tune rows for configured normalization and training populations."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_rebuilds_selected_model_inputs" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_rejects_changed_model_input_or_population" }]

[[verifiers]]
id = "H1-VR-06"
requirement_ids = ["H1-REQ-06"]
acceptance_conditions = ["The training run uses the approved architecture, objectives, seed, data identities, and selection rule and reproduces the retained encoder weights with complete logs and checkpoints."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_training.py", symbol = "test_trains_selected_hopfield_encoder" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_training.py", symbol = "test_rejects_changed_training_contract" }]

[[verifiers]]
id = "H1-VR-07"
requirement_ids = ["H1-REQ-07"]
acceptance_conditions = ["The final gate requires equal prediction bytes and an exactly equal hold PearsonDelta of 0.5861640938949398."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_reconstruction.py", symbol = "test_reproduces_selected_hopfield_output" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_reconstruction.py", symbol = "test_rejects_equal_score_with_changed_prediction_bytes" }]

[[verifiers]]
id = "H1-VR-08"
requirement_ids = ["H1-REQ-08"]
acceptance_conditions = ["The terminal registration resolves every accepted Phase 1 receipt, artifact, source commit, and producer edge from retained records."]
success_case = { repository_id = "rico", path = "tests/phase1/test_hopfield_registration.py", symbol = "test_resolves_complete_phase1_provenance" }
rejection_cases = [{ repository_id = "rico", path = "tests/phase1/test_hopfield_registration.py", symbol = "test_rejects_severed_phase1_provenance" }]

