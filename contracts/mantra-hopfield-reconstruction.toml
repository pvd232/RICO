schema_version = 1
contract_id = "mantra-hopfield-reconstruction"
title = "MANTRA Hopfield Reconstruction"

[[requirements]]
id = "H1-REQ-01"
claim = "Phase 1 must begin from the selected Phase 0 Hopfield encoder SHA-256 2433527c3b23b66a16cedc0f7bc43867e4298af4d7a0733b202a8018ba876610, prediction SHA-256 d7180c4669a11b0b2fb184814aafb48ebafe75b02e4bd07998c337aa64dc59b7, and hold PearsonDelta 0.5861640938949398."
depends_on = []
verifier_ids = ["H1-VR-01"]

[[requirements]]
id = "H1-REQ-02"
claim = "Before any numerical comparison, training, or prediction, the selected Hopfield path must reject disagreement among the ordered perturbation labels for descriptor features, coefficient targets, and fit or tune truth rows."
depends_on = ["H1-REQ-01"]
verifier_ids = ["H1-VR-02"]

[[requirements]]
id = "H1-REQ-03"
claim = "Before replay training, one complete descriptor-input ledger must name every selected matched-control, control-program, core83, response40, family64, and gene-shift file, its retained digest, producing script or record, and restore route. Restoring that ledger must reproduce the historical keys, perturbation order, gene order, shapes, dtypes, and values without rerunning upstream producers."
depends_on = ["H1-REQ-02"]
verifier_ids = ["H1-VR-03"]

[[requirements]]
id = "H1-REQ-04"
claim = "Before replay training, one complete target-input ledger must name every selected coefficient target, fit and tune truth surface, response-block contract, response rotation, and response-similarity graph, together with its retained digest, producing script or record, and restore route. Restoring that ledger must reproduce the historical keys, row and column order, shapes, dtypes, and values without rerunning upstream producers."
depends_on = ["H1-REQ-03"]
verifier_ids = ["H1-VR-04"]

[[requirements]]
id = "H1-REQ-05"
claim = "The Hopfield loader must assemble the declared replay bundle and reproduce every retained model input array and fitted transformation state: descriptor columns use moments fitted on the declared fit plus tune rows; coefficient similarity uses per-row mean centering followed by L2 normalization; and every gene, perturbation, shape, dtype, and array order remains fixed."
depends_on = ["H1-REQ-04"]
verifier_ids = ["H1-VR-05"]

[[requirements]]
id = "H1-REQ-06"
claim = "The 187 to 384 to 384 to 128 Hopfield encoder must train under the selected objectives and seed in the declared Python 3.13, Torch 2.12.1, and CUDA 13 environment, including the configured auxiliary posterior target built from the whitened-PCA-denoised coefficient bank and neighbors selected by raw-coefficient cosine similarity. Two independent strict VIPER runs must reproduce encoder SHA-256 af1f62c4c315c65e7379b97c57646b49b35c7f3fc3f69fcf6f94f0c8df276da9 and 1084512 bytes while retaining the historical encoder as the comparison oracle. Final retrieval must continue to use the configured raw coefficient value memory."
depends_on = ["H1-REQ-05", "E0-REQ-09", "E0-REQ-12"]
verifier_ids = ["H1-VR-06"]

[[requirements]]
id = "H1-REQ-07"
claim = "Raw-gene retrieval from fit memory at temperature 0.055 and reference correction must reproducibly emit prediction SHA-256 f8e8e6a6fe291143debd3d8e8b3ab9c4e2aed5afd3b2391e7856c7d8fd7e262b, 38391087 bytes, and hold PearsonDelta 0.5861640983697456 in the declared modern environment while retaining the Phase 0 prediction and score as comparison oracles."
depends_on = ["H1-REQ-06"]
verifier_ids = ["H1-VR-07"]

[[requirements]]
id = "H1-REQ-08"
claim = "Every accepted Phase 1 producer, input, output, comparison, and implementation commit must remain reachable through retained VIPER and contract-protocol evidence."
depends_on = ["H1-REQ-11"]
verifier_ids = ["H1-VR-08"]

[[requirements]]
id = "H1-REQ-09"
claim = "After strict modern Hopfield and MIL replay baselines are frozen, the legacy Hopfield path must consume the exact retained MIL descriptor bundle: the shared 83-value core block, the 144-value five-source family block, and its matching 40-value response proxy. The bridge run must change only the encoder input-width binding from 187 to 267, retrain and evaluate the otherwise unchanged legacy model, and freeze its inputs, checkpoint, predictions, score, configuration, runtime, and implementation commit as the Hopfield MIL-stack bridge baseline."
depends_on = ["H1-REQ-08", "M2-REQ-06", "E0-REQ-08", "E0-REQ-09"]
verifier_ids = ["H1-VR-09"]

[[requirements]]
id = "H1-REQ-10"
claim = "Each of the thirteen declared Hopfield model inputs must be produced from its true external or versioned source by a retained VIPER source-acquisition and Build chain, then compared with the retained input on keys, ordered axes, shapes, dtypes, values, bytes, and SHA-256. Each chain must first build in the modern environment; on numerical mismatch it must rerun only acquisition and Build in the historical environment; if that matches, record environment-caused divergence and pin a repeated modern result; otherwise verify the configuration once, fail fast on another unexplained mismatch, and pin only a repeated corrected baseline."
depends_on = ["H1-REQ-07"]
verifier_ids = ["H1-VR-10"]

[[requirements]]
id = "H1-REQ-11"
claim = "The final strict VIPER replay must consume only the thirteen accepted Build outputs, connect stage outputs to downstream stages as FutureInputRefs, and execute Embed, Predict, and Evaluate without reading retained model-input files directly. It must reproduce the accepted modern encoder, prediction, and score identities while retaining historical artifacts only as evaluation oracles."
depends_on = ["H1-REQ-10"]
verifier_ids = ["H1-VR-11"]

[[verifiers]]
id = "H1-VR-01"
requirement_ids = ["H1-REQ-01"]
acceptance_conditions = ["The typed Phase 1 contract names the selected score and exact prediction digest, and the retained Phase 0 index resolves the replay receipt."]
success_case = { repository_id = "rico", path = "tests/phase1/test_hopfield_contract.py", symbol = "HopfieldContractTests.test_names_selected_phase0_baseline" }
rejection_cases = [{ repository_id = "rico", path = "tests/phase1/test_hopfield_contract.py", symbol = "HopfieldContractTests.test_rejects_changed_prediction_identity" }]

[[verifiers]]
id = "H1-VR-02"
requirement_ids = ["H1-REQ-02"]
acceptance_conditions = ["The existing Hopfield loader accepts equal feature, coefficient-target, and truth perturbation labels and rejects a truth surface whose fit or tune labels are reordered."]
success_case = { repository_id = "mantra", path = "experiments/v1938_sota_clean_repro/tests/step01/test_hopfield_direct_family_contract.py", symbol = "test_accepts_matching_truth_perturbation_order" }
rejection_cases = [{ repository_id = "mantra", path = "experiments/v1938_sota_clean_repro/tests/step01/test_hopfield_direct_family_contract.py", symbol = "test_rejects_truth_perturbation_order_mismatch" }]

[[verifiers]]
id = "H1-VR-03"
requirement_ids = ["H1-REQ-03"]
acceptance_conditions = ["The descriptor-input ledger resolves every retained file to its exact digest, producing script or record, and restore route; restoring it reproduces the historical NPZ keys, ordered perturbations and genes, shapes, dtypes, and arrays without running an upstream producer."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_restores_selected_descriptor_inputs" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_rejects_changed_descriptor_input" }]

[[verifiers]]
id = "H1-VR-04"
requirement_ids = ["H1-REQ-04"]
acceptance_conditions = ["The target-input ledger resolves every retained file to its exact digest, producing script or record, and restore route; restoring it reproduces the historical NPZ or JSON keys, ordered rows and columns, shapes, dtypes, and values without running an upstream producer."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_restores_selected_target_inputs" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_rejects_changed_target_input" }]

[[verifiers]]
id = "H1-VR-05"
requirement_ids = ["H1-REQ-05"]
acceptance_conditions = ["The loader assembles only ledger-restored inputs and reproduces every retained array and fitted normalization state; descriptor columns use fit plus tune moments, and coefficient similarities use row-mean centering followed by L2 normalization."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_assembles_selected_replay_inputs" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_preprocessing.py", symbol = "test_rejects_changed_model_input_or_population" }]

[[verifiers]]
id = "H1-VR-06"
requirement_ids = ["H1-REQ-06"]
acceptance_conditions = ["Two independent strict VIPER runs under the declared modern environment use the same source, configuration, seed, inputs, architecture, objectives, and raw value memory and emit the declared encoder bytes and SHA-256 with complete logs and checkpoints."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_replay.py", symbol = "test_accepts_repeated_modern_encoder_identity" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_replay.py", symbol = "test_rejects_changed_modern_encoder_identity" }]

[[verifiers]]
id = "H1-VR-07"
requirement_ids = ["H1-REQ-07"]
acceptance_conditions = ["Two independent strict VIPER runs under the declared modern environment emit the declared prediction bytes, SHA-256, and hold PearsonDelta; equal score with changed arrays or file bytes fails."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_replay.py", symbol = "test_accepts_repeated_modern_prediction_identity" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_replay.py", symbol = "test_rejects_equal_score_with_changed_prediction_bytes" }]

[[verifiers]]
id = "H1-VR-08"
requirement_ids = ["H1-REQ-08"]
acceptance_conditions = ["The terminal registration resolves every accepted Phase 1 receipt, artifact, source commit, and producer edge from retained records."]
success_case = { repository_id = "rico", path = "tests/phase1/test_hopfield_registration.py", symbol = "test_resolves_complete_phase1_provenance" }
rejection_cases = [{ repository_id = "rico", path = "tests/phase1/test_hopfield_registration.py", symbol = "test_rejects_severed_phase1_provenance" }]

[[verifiers]]
id = "H1-VR-09"
requirement_ids = ["H1-REQ-09"]
acceptance_conditions = ["The bridge run starts from the parity-proven legacy Hopfield source and configuration; resolves the exact retained 83-value core, 144-value family, and 40-value response artifact digests with their canonical row and split identities; changes only the encoder input width from 187 to 267; keeps the complete numeric training set GPU-resident; and reproduces its frozen bridge result from the retained checkpoint and inputs."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_mil_input_bridge.py", symbol = "test_freezes_legacy_hopfield_on_exact_mil_input_stack" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_mil_input_bridge.py", symbol = "test_rejects_mixed_input_stack_or_unrelated_model_change" }]

[[verifiers]]
id = "H1-VR-10"
requirement_ids = ["H1-REQ-10"]
acceptance_conditions = ["One parameterized observer resolves all thirteen accepted inputs through their versioned source, Build owner and configuration, comparison receipt, mismatch classification, and repeatable accepted identity; missing source edges, missing comparisons, unexplained mismatches, and nonrepeatable replacements fail."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_source_reconstruction.py", symbol = "test_reconstructs_every_hopfield_input_from_its_true_source" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_source_reconstruction.py", symbol = "test_rejects_incomplete_or_unexplained_input_reconstruction" }]

[[verifiers]]
id = "H1-VR-11"
requirement_ids = ["H1-REQ-11"]
acceptance_conditions = ["The frozen stage graph connects each accepted Build artifact to Embed by FutureInputRef, connects Embed to Predict and Predict to Evaluate, rejects direct retained model-input paths, and the resulting strict replay emits the accepted modern encoder, prediction, and score identities."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_source_reconstruction.py", symbol = "test_replays_hopfield_from_rebuilt_outputs_only" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_hopfield_source_reconstruction.py", symbol = "test_rejects_retained_input_in_rebuilt_replay" }]

