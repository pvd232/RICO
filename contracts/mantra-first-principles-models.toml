schema_version = 1
contract_id = "mantra-first-principles-models"
title = "MANTRA First-Principles Models"

[[requirements]]
id = "S6-REQ-01"
claim = "One ordered perturbation-identity table must align every corrected prior modality and its observed-value mask to the canonical perturbation rows before any reduction, fusion, regression, or encoder consumes those values."
depends_on = ["R5-REQ-06"]
verifier_ids = ["S6-VR-01"]

[[requirements]]
id = "S6-REQ-02"
claim = "A versioned variant manifest must enumerate the allowed per-prior transforms: unreduced identity, fit-only PCA, and fit-only MLP. Each transform must retain its inputs, fitted state, ordered outputs, dimensions, missingness handling, and reconstruction or held-out diagnostic."
depends_on = ["S6-REQ-01", "E0-REQ-11"]
verifier_ids = ["S6-VR-02"]

[[requirements]]
id = "S6-REQ-03"
claim = "The variant manifest must define the selected fusion for each transformed prior set, including concatenation and a learned fusion MLP, and retain the modality order, masks, fitted parameters, output width, and validation diagnostic."
depends_on = ["S6-REQ-02"]
verifier_ids = ["S6-VR-03"]

[[requirements]]
id = "S6-REQ-04"
claim = "The variant manifest must explicitly route each fused or unfused prior representation either through fit-only grouped ridge regression or directly to the Hopfield encoder. It must include unreduced identity to grouped ridge, per-prior PCA to grouped ridge, per-prior MLP and fusion to grouped ridge, reduced or fused priors directly to Hopfield, and unreduced priors directly to Hopfield, and reject every unlisted composition."
depends_on = ["S6-REQ-03", "E0-REQ-07"]
verifier_ids = ["S6-VR-04"]

[[requirements]]
id = "S6-REQ-05"
claim = "One auxiliary MLP must predict a distribution over fitted control-state clusters for each held-out perturbation, decode that distribution into the 19-value ctrl19 vector, and retain the fitted MLP, cluster centers, decoder, inputs, predictions, and tune selection without reading held-out response truth."
depends_on = ["S6-REQ-01", "E0-REQ-02"]
verifier_ids = ["S6-VR-05"]

[[requirements]]
id = "S6-REQ-06"
claim = "Each retained historical 40-value response-block feature must be reproduced from the rebuilt block definitions and response coefficients: fit rows use their direct coefficients, tune and held-out rows use only fit rows through that model path's declared query features and retrieval rule, and the hard 16, soft semantic 16, and spectral 8 components must match the corresponding Phase 0 artifact."
depends_on = ["S6-REQ-04", "R5-REQ-07"]
verifier_ids = ["S6-VR-06"]

[[requirements]]
id = "S6-REQ-07"
claim = "One model-input bundle per declared perturbation-representation variant must bind that variant, predicted ctrl19 rows, derived core83 and declared PCA64 control features, parity-verified response-block rows, response-target bundle, canonical splits, normalization population, execution profile, and every fitted transform; each Hopfield or MIL plan must name exactly one bundle digest."
depends_on = ["S6-REQ-05", "S6-REQ-06"]
verifier_ids = ["S6-VR-07"]

[[requirements]]
id = "S6-REQ-08"
claim = "Before a prior-fusion variant may train, one controlled input-substitution ladder must start Hopfield from the H1-REQ-09 MIL-stack bridge baseline and MIL from the M2-REQ-06 parity baseline while replacing the canonical atlas, gene panels, control programs, response programs, response-block definitions, response-block rows, and corrected priors one producer at a time. Each step must hold every other artifact digest fixed, use one common rebuilt artifact reference in both model paths where the artifact is shared, and preserve the corresponding frozen baseline result."
depends_on = ["S6-REQ-07", "E0-REQ-08"]
verifier_ids = ["S6-VR-08"]

[[requirements]]
id = "S6-REQ-09"
claim = "After the input-substitution ladder passes, the legacy Hopfield and MIL execution scripts must be decomposed by replacing one orthogonal model component at a time with its modular owner. Each replacement must retain the target component's inputs, fitted state, outputs, and diagnostics, hold every non-target source, configuration, and artifact digest fixed, and preserve the Hopfield bridge or MIL parity prediction and score before the next component changes."
depends_on = ["S6-REQ-08", "E0-REQ-09", "E0-REQ-10"]
verifier_ids = ["S6-VR-09"]

[[requirements]]
id = "H7-REQ-01"
claim = "One Hopfield construction stage must build an encoder for each declared perturbation-representation variant and persist the exact bundle digest, complete architecture, initialized parameters, memory layout, input and output dimensions, and construction diagnostics consumed by training."
depends_on = ["S6-REQ-09", "E0-REQ-09"]
verifier_ids = ["H7-VR-01"]

[[requirements]]
id = "H7-REQ-02"
claim = "The Hopfield training stage must execute each declared perturbation-representation variant, exclude hold responses from fitting and selection, and retain its bundle digest, configuration, seed, checkpoints, epoch scores, selection decisions, logs, final weights, runtime, and peak GPU memory."
depends_on = ["H7-REQ-01"]
verifier_ids = ["H7-VR-02"]

[[requirements]]
id = "H7-REQ-03"
claim = "The Hopfield inference stage must load each accepted variant checkpoint and frozen input bundle, produce ordered fit, tune, and hold predictions without refitting, and retain the exact output arrays and identities."
depends_on = ["H7-REQ-02"]
verifier_ids = ["H7-VR-03"]

[[requirements]]
id = "H7-REQ-04"
claim = "One Hopfield diagnostic stage must read each variant's frozen inputs, accepted checkpoint, and persisted predictions and emit the declared retrieval, coefficient, response, split, runtime, memory, and failure diagnostics without fitting or changing model state."
depends_on = ["H7-REQ-03"]
verifier_ids = ["H7-VR-04"]

[[requirements]]
id = "H7-REQ-05"
claim = "The Hopfield evaluation stage must compute canonical PearsonDelta through src/mantra/eval/eval.py on the named GEARS response surface for every declared variant and compare each result with both the original Phase 1 parity baseline and the H1-REQ-09 MIL-stack bridge baseline."
depends_on = ["H7-REQ-04"]
verifier_ids = ["H7-VR-05"]

[[requirements]]
id = "M8-REQ-01"
claim = "One MIL bag-construction stage must build and persist the ordered bag membership, instances, masks, attention priors, conditioning values, and dimensions consumed by the MIL models from the shared model-input bundle."
depends_on = ["S6-REQ-09", "E0-REQ-10"]
verifier_ids = ["M8-VR-01"]

[[requirements]]
id = "M8-REQ-02"
claim = "One MIL construction stage must build the teacher and student models from the persisted bag schema and retain their complete architectures, initialized parameters, input and output dimensions, and construction diagnostics."
depends_on = ["M8-REQ-01"]
verifier_ids = ["M8-VR-02"]

[[requirements]]
id = "M8-REQ-03"
claim = "The MIL training stages must consume the persisted bags and model constructions, exclude hold responses from fitting and selection, and retain objective components, configuration, seeds, checkpoints, intermediary scores, decisions, logs, and final weights."
depends_on = ["M8-REQ-02"]
verifier_ids = ["M8-VR-03"]

[[requirements]]
id = "M8-REQ-04"
claim = "The MIL inference stage must load accepted teacher and student checkpoints plus the frozen input bundle, produce ordered fit, tune, and hold predictions without refitting, and retain the exact output arrays and identities."
depends_on = ["M8-REQ-03"]
verifier_ids = ["M8-VR-04"]

[[requirements]]
id = "M8-REQ-05"
claim = "One MIL diagnostic stage must read the frozen bags, accepted checkpoints, and persisted predictions and emit the declared attention, teacher-student, response, split, and failure diagnostics without fitting or changing model state."
depends_on = ["M8-REQ-04"]
verifier_ids = ["M8-VR-05"]

[[requirements]]
id = "M8-REQ-06"
claim = "The MIL evaluation stage must compute canonical PearsonDelta through src/mantra/eval/eval.py on the named GEARS response surface and compare the rebuilt result with the Phase 2 parity baseline."
depends_on = ["M8-REQ-05"]
verifier_ids = ["M8-VR-06"]

[[requirements]]
id = "B9-REQ-01"
claim = "One benchmark stage must compare every declared Hopfield perturbation-representation variant and the rebuilt MIL result with the original Phase 1 Hopfield parity baseline, the H1-REQ-09 MIL-stack bridge baseline, and the Phase 2 MIL parity baseline on the same ordered perturbations, response genes, split membership, truth arrays, and canonical PearsonDelta implementation."
depends_on = ["H7-REQ-05", "M8-REQ-06"]
verifier_ids = ["B9-VR-01"]

[[requirements]]
id = "B9-REQ-02"
claim = "The pre-graph baseline must freeze the accepted identity table, canonical atlas, corrected priors, response targets, model inputs, weights, predictions, diagnostics, benchmark results, commits, and complete VIPER provenance without executing a graph-encoder PairBlock."
depends_on = ["B9-REQ-01"]
verifier_ids = ["B9-VR-02"]

