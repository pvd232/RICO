schema_version = 1
contract_id = "mantra-mil-reconstruction"
title = "MANTRA MIL Reconstruction"

[[requirements]]
id = "M2-REQ-01"
claim = "The standalone MIL rebuild must use the selected v1952 seed-123460 without_control inputs, create one student query, exclude the dormant proto_count 11 setting from the active architecture, and consume no Hopfield output."
depends_on = ["H1-REQ-08"]
verifier_ids = ["M2-VR-01"]

[[requirements]]
id = "M2-REQ-02"
claim = "The selected MIL descriptor rows, coefficient and gene targets, control shift, cell-program projections, matched cell programs, teacher bags, attention priors, and conditioning arrays must be rebuilt and compared with their historical counterparts before training."
depends_on = ["M2-REQ-01"]
verifier_ids = ["M2-VR-02"]

[[requirements]]
id = "M2-REQ-03"
claim = "The teacher, donor embeddings, and single-query student must be rebuilt in producer order and reproduce the retained MIL identity vectors; every selection score and checkpoint decision must be emitted to stdout and the primary experiment log and retained through VIPER."
depends_on = ["M2-REQ-02"]
verifier_ids = ["M2-VR-03"]

[[requirements]]
id = "M2-REQ-04"
claim = "The selected Step02 covariance shrinkage, teacher-neighbor smoothing, and retrieval path must reproduce prediction SHA-256 c0011d71436c540bde8dd00f9e2f8ac8fb46aa787161460a1aefce5f0f1277be, weight SHA-256 8290145991446afd9f45c3f3be1ad7fe95518dfe6f75e1e950b86a2b84c323ab, and hold PearsonDelta 0.5924883417873266."
depends_on = ["M2-REQ-03"]
verifier_ids = ["M2-VR-04"]

[[requirements]]
id = "M2-REQ-05"
claim = "The selected Step03 residual correction, reference shift, and per-gene calibration must reproduce prediction SHA-256 e39230c8c17954602a2c3dbfc26ed4759922be36bdabc6b27ffb96204a07f7fd, weight SHA-256 372e4409468d7d0441383833601d2a008ab24fd309ae4cd6fb2ebaa36e1dd3f0, and hold PearsonDelta 0.6025499488874759."
depends_on = ["M2-REQ-04"]
verifier_ids = ["M2-VR-05"]

[[requirements]]
id = "M2-REQ-06"
claim = "Every accepted Phase 2 producer, input, output, comparison, checkpoint, and implementation commit must remain reachable through retained VIPER and contract-protocol evidence."
depends_on = ["M2-REQ-05"]
verifier_ids = ["M2-VR-06"]

[[verifiers]]
id = "M2-VR-01"
requirement_ids = ["M2-REQ-01"]
acceptance_conditions = ["The selected MIL configuration resolves the standalone historical inputs, creates one student query, ignores proto_count 11, and has no dependency on a Hopfield output."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_mil_contract.py", symbol = "test_accepts_selected_standalone_mil_configuration" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_mil_contract.py", symbol = "test_rejects_hopfield_or_multi_query_dependency" }]

[[verifiers]]
id = "M2-VR-02"
requirement_ids = ["M2-REQ-02"]
acceptance_conditions = ["Every rebuilt MIL training input matches its historical keys, perturbation order, gene order, shape, dtype, and values, and the loader reports the selected bag and conditioning rules."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_mil_inputs.py", symbol = "test_rebuilds_selected_mil_inputs" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_mil_inputs.py", symbol = "test_rejects_changed_mil_input_or_bag" }]

[[verifiers]]
id = "M2-VR-03"
requirement_ids = ["M2-REQ-03"]
acceptance_conditions = ["The approved MIL configuration reproduces the teacher and student arrays, checkpoints, selection records, and fixed MIL identity contract without loading hold targets during selection."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_mil_training.py", symbol = "test_rebuilds_selected_teacher_and_student" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_mil_training.py", symbol = "test_rejects_changed_training_intermediate_or_hold_selection" }]

[[verifiers]]
id = "M2-VR-04"
requirement_ids = ["M2-REQ-04"]
acceptance_conditions = ["The Step02 output arrays and weight arrays equal their retained historical counterparts and the hold PearsonDelta equals 0.5924883417873266."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_mil_reconstruction.py", symbol = "test_rebuilds_selected_step02" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_mil_reconstruction.py", symbol = "test_rejects_changed_step02_output" }]

[[verifiers]]
id = "M2-VR-05"
requirement_ids = ["M2-REQ-05"]
acceptance_conditions = ["The Step03 output arrays and weight arrays equal their retained historical counterparts and the final hold PearsonDelta equals 0.6025499488874759."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_mil_reconstruction.py", symbol = "test_rebuilds_selected_step03" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_mil_reconstruction.py", symbol = "test_rejects_equal_score_with_changed_step03_output" }]

[[verifiers]]
id = "M2-VR-06"
requirement_ids = ["M2-REQ-06"]
acceptance_conditions = ["The terminal registration resolves every accepted Phase 2 receipt, artifact, source commit, and producer edge from retained records."]
success_case = { repository_id = "rico", path = "tests/phase2/test_mil_registration.py", symbol = "test_resolves_complete_mil_reconstruction" }
rejection_cases = [{ repository_id = "rico", path = "tests/phase2/test_mil_registration.py", symbol = "test_rejects_severed_phase2_provenance" }]

[[pair_blocks]]
id = "M2-PB-01"
requirement_ids = ["M2-REQ-01"]
depends_on = ["H1-PB-08"]
repository_id = "mantra"
requirement_contribution = "Bind the MIL rebuild to its standalone historical inputs and active single-query architecture."
completion_evidence = ["implementation_review", "viper_registration"]

