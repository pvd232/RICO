id = "M2-PB-03"
requirement_ids = ["M2-REQ-03"]
depends_on = ["M2-PB-02"]
repository_id = "mantra"
requirement_contribution = "Train the selected teacher and single-query student and reproduce the retained MIL identity vectors."
completion_evidence = ["implementation_review", "viper_registration"]

[[pair_blocks]]
id = "M2-PB-04"
requirement_ids = ["M2-REQ-04"]
depends_on = ["M2-PB-03"]
repository_id = "mantra"
