requirement_ids = ["E0-REQ-08"]
acceptance_conditions = ["Replay, bridge, and substitution plans select seeded CPU scikit-learn Lloyd KMeans wherever clustering occurs; throughput plans record GPU Triton KMeans, and the verifier rejects a frozen-result parity claim from that path."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_execution_profiles.py", symbol = "test_selects_kmeans_backend_by_execution_profile" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_execution_profiles.py", symbol = "test_rejects_gpu_kmeans_byte_parity_claim" }]

