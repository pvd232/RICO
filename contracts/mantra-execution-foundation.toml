schema_version = 1
contract_id = "mantra-execution-foundation"
title = "MANTRA Execution and Acceleration Foundation"

[[requirements]]
id = "E0-REQ-01"
claim = "Before an ephemeral GPU run starts, VIPER must publish and restore one probe artifact through a production GCS-backed ViperCloudClient, verify its digest after restoration, and retain the durable reference in the run record. Each GCS object key must prefix the owner, workspace, and source revision while preserving the exact repository-relative path produced by VIPER's canonical initialized workspace layout."
depends_on = ["E0-REQ-02"]
verifier_ids = ["E0-VR-01"]

[[requirements]]
id = "E0-REQ-02"
claim = "The governed GPU launcher must search declared lower-demand regions before us-central1, continue after regional capacity or quota rejection, force boot-disk auto-delete after machine-image overrides, and clean up every worker, boot disk, NAT, and router created by a failed launch. A live launch must require a verified durable-storage probe and record the source commit, resolved VIPER plan and configuration, command, input digests, declared seeds, Python and accelerator RNG states, determinism environment variables, image, locked Python environment, operating system, CUDA and driver versions, GPU model and count, device and dtype policy, writable VIPER workspace, and durable artifact destination. Resume must reject any unreviewed execution-identity change, and final teardown must deterministically delete the worker and boot disk after accepted records and artifacts restore."
depends_on = []
verifier_ids = ["E0-VR-02"]

[[requirements]]
id = "E0-REQ-03"
claim = "One versioned optimization inventory must map every accelerated MANTRA operation to its historical owner, modular owner, CPU reference, numerical parity gate, throughput gate, device and precision policy, determinism policy, and consuming reconstruction stage."
depends_on = ["E0-REQ-01"]
verifier_ids = ["E0-VR-03"]

[[requirements]]
id = "E0-REQ-04"
claim = "The modular response pipeline must preserve batched GPU cNMF and NMF execution, including parallel restarts, mini-batching, sparse-input handling, lazy split-sign expansion, stable float32 factors, and preloaded dense device tensors."
depends_on = ["E0-REQ-03"]
verifier_ids = ["E0-VR-04"]

[[requirements]]
id = "E0-REQ-05"
claim = "The modular response pipeline must preserve the GPU NNLS implementations used to score and project response programs, including batched dense and sparse Ghost paths, and must compare their coefficients and reconstructions with the declared CPU reference within a named tolerance."
depends_on = ["E0-REQ-03"]
verifier_ids = ["E0-VR-05"]

[[requirements]]
id = "E0-REQ-06"
claim = "The modular response pipeline must preserve vectorized GPU Sinkhorn transport and barycentric matched-control residuals and must retain convergence, marginal error, transport mass, device, precision, batch shape, and CPU-reference diagnostics."
depends_on = ["E0-REQ-03"]
verifier_ids = ["E0-VR-06"]

[[requirements]]
id = "E0-REQ-07"
claim = "The modular feature and model pipelines must preserve GPU ridge solvers for grouped-prior, control-state, coefficient, and correction regressions, with the selected primal or dual form, penalty, device, dtype, and CPU-reference prediction error retained."
depends_on = ["E0-REQ-03"]
verifier_ids = ["E0-VR-07"]

[[requirements]]
id = "E0-REQ-08"
claim = "Each execution must declare a parity or throughput profile. Every replay, bridge run, or one-at-a-time substitution that preserves a frozen result must use seeded scikit-learn Lloyd KMeans on CPU wherever clustering occurs. A later throughput run may use Triton KMeans on GPU but must record that backend and may not claim parity with the deterministic KMeans result."
depends_on = ["E0-REQ-04"]
verifier_ids = ["E0-VR-08"]

[[requirements]]
id = "E0-REQ-09"
claim = "The modular Hopfield pipeline must copy every numeric training tensor to the GPU once before training, keep the complete fit and tune tensors resident through full-dataset training and inference, and limit later host-device transfers to checkpoint, log, and final-artifact persistence. It must also preserve vectorized matrix operations and top-k retrieval, deterministic CUDA settings, explicit precision, historical normalization and checkpoint selection, and retain transfer counts and bytes, runtime, and peak GPU memory through VIPER."
depends_on = ["E0-REQ-03"]
verifier_ids = ["E0-VR-09"]

[[requirements]]
id = "E0-REQ-10"
claim = "The modular MIL pipeline must copy every numeric training tensor to the GPU once before teacher or student training, keep the complete tensors resident through training and inference, and form the historical 128-row optimizer batches only through device-side indices. Every training step must read numeric rows from those resident tensors. The pipeline must also preserve fused CUDA optimizers, vectorized top-k and einsum routing, deterministic CUDA settings, explicit precision, historical checkpoint selection, and retain transfer counts and bytes, runtime, and peak GPU memory through VIPER."
depends_on = ["E0-REQ-03"]
verifier_ids = ["E0-VR-10"]

[[requirements]]
id = "E0-REQ-11"
claim = "The modular prior and response pipelines must preserve deterministic GPU low-rank PCA and SVD where the historical pipeline used them, including fitted rows, centering, rank, seed, sign convention, device, precision, components, singular values, projections, and reconstruction diagnostics."
depends_on = ["E0-REQ-03"]
verifier_ids = ["E0-VR-11"]

[[verifiers]]
id = "E0-VR-01"
requirement_ids = ["E0-REQ-01"]
acceptance_conditions = ["A production VIPER client publishes a probe to GCS under owner, workspace, and source-revision prefixes while preserving VIPER's exact repository-relative artifact path; a fresh process restores the same bytes through the retained viper:// reference, and digest, path, or object substitution fails."]
success_case = { repository_id = "viper", path = "tests/test_gcs_storage.py", symbol = "test_publishes_and_restores_durable_snapshot" }
rejection_cases = [{ repository_id = "viper", path = "tests/test_gcs_storage.py", symbol = "test_rejects_changed_or_missing_cloud_object" }]

[[verifiers]]
id = "E0-VR-02"
requirement_ids = ["E0-REQ-02"]
acceptance_conditions = ["The launcher searches lower-demand regions first, skips capacity and quota failures, forces and verifies boot-disk auto-delete, cleans up every resource created by a failed attempt, and blocks a live worker without a verified storage probe. The launch probe binds the complete execution identity to the VIPER run, resume rejects an unreviewed seed, RNG-state, environment, command, input, device, or configuration change, and final teardown finds no worker or boot disk after accepted artifacts restore."]
success_case = { repository_id = "rico", path = "tests/infrastructure/test_mantra_gpu_lifecycle.py", symbol = "test_probes_launch_and_deletes_worker_and_disk" }
rejection_cases = [{ repository_id = "rico", path = "tests/infrastructure/test_mantra_gpu_lifecycle.py", symbol = "test_blocks_training_or_teardown_on_failed_probe" }]

[[verifiers]]
id = "E0-VR-03"
requirement_ids = ["E0-REQ-03"]
acceptance_conditions = ["Every required optimization has one resolvable historical owner, modular owner, reference comparison, performance threshold, execution policy, and downstream consumer, and an omitted operation fails."]
success_case = { repository_id = "rico", path = "tests/roadmap/test_mantra_optimization_inventory.py", symbol = "test_inventory_covers_every_accelerated_operation" }
rejection_cases = [{ repository_id = "rico", path = "tests/roadmap/test_mantra_optimization_inventory.py", symbol = "test_rejects_missing_owner_gate_or_consumer" }]

