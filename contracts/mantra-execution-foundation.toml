acceptance_conditions = ["Dense and sparse GPU NNLS paths satisfy coefficient and reconstruction tolerances against their CPU references and the selected path and iteration count are retained."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_gpu_response_kernels.py", symbol = "test_preserves_gpu_nnls_paths" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_gpu_response_kernels.py", symbol = "test_rejects_nnls_drift_or_unrecorded_backend" }]

