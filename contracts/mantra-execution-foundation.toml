id = "E0-VR-04"
requirement_ids = ["E0-REQ-04"]
acceptance_conditions = ["The modular GPU cNMF path matches the CPU reference within tolerance for fixed initialization, exercises every declared optimization, and exceeds the retained minimum throughput on an L4."]
success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_gpu_response_kernels.py", symbol = "test_preserves_batched_gpu_cnmf" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_gpu_response_kernels.py", symbol = "test_rejects_unverified_or_deoptimized_cnmf" }]

