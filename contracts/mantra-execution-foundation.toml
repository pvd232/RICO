success_case = { repository_id = "mantra", path = "src/mantra/rebuild/tests/test_gpu_response_kernels.py", symbol = "test_preserves_vectorized_gpu_sinkhorn" }
rejection_cases = [{ repository_id = "mantra", path = "src/mantra/rebuild/tests/test_gpu_response_kernels.py", symbol = "test_rejects_sinkhorn_drift_or_missing_diagnostics" }]

