schema_version = 1
contract_id = "mantra-prior-reconstruction"
title = "MANTRA Prior Reconstruction"

[[requirements]]
id = "P4-REQ-01"
claim = "Before corrected reconstruction begins, the inventory must distinguish raw biological sources, transformed prior blocks, and final model inputs. It must account explicitly for the eleven arrays in the retained compressed prior bundle—corum, depmap_essentiality, dorothea_grn, gene_family, mechanistic256, motif, pathway_hallmark, ppi_spectral, ptm, regulatory256, and subcellular—and resolve every model-consumed prior to its raw sources, typed ingest, biological identity joins, transformation parameters, output arrays, historical counterpart, and demonstrated reconstruction boundary."
depends_on = ["D3-REQ-06"]
verifier_ids = ["P4-VR-01"]

[[requirements]]
id = "P4-REQ-02"
claim = "Each selected prior source must be reacquired or restored through one VIPER stage that retains the exact request, source version, raw bytes, parser inputs, typed output, and failures without writing partial downloads to final paths."
depends_on = ["P4-REQ-01"]
verifier_ids = ["P4-VR-02"]

[[requirements]]
id = "P4-REQ-03"
claim = "A perturbation that resolves to a current pseudogene must remain on the experimental row axis, retain its current gene identity and locus type, and mark protein-derived modalities missing instead of dropping the row or fabricating protein evidence."
depends_on = ["P4-REQ-02"]
verifier_ids = ["P4-VR-03"]

[[requirements]]
id = "P4-REQ-04"
claim = "The interaction prior must parse every byte of each pinned source, preserve source attribution for every accepted edge, report per-source and union coverage, and reject a truncated or concurrently changing source before dimensional reduction."
depends_on = ["P4-REQ-03"]
verifier_ids = ["P4-VR-04"]

[[requirements]]
id = "P4-REQ-05"
claim = "Every non-interaction prior selected for the rebuilt models must be reconstructed from its pinned typed sources and report unresolved perturbations, missing modalities, duplicate identities, row order, dimensions, dtypes, and transformation parameters."
depends_on = ["P4-REQ-04"]
verifier_ids = ["P4-VR-05"]

[[requirements]]
id = "P4-REQ-06"
claim = "One corrected prior bundle must preserve the canonical perturbation order, distinguish observed values from missing modalities, and bind every array to its source and build evidence for downstream model stages."
depends_on = ["P4-REQ-05"]
verifier_ids = ["P4-VR-06"]

[[requirements]]
id = "P4-REQ-10A"
claim = "The alphagenome package must resolve its raw sources, run its declared build through VIPER, and freeze a repeated modern baseline when historical neural coordinates do not reproduce."
depends_on = ["P4-REQ-03"]
verifier_ids = ["P4-VR-10"]

[[requirements]]
id = "P4-REQ-10B"
claim = "The alphagenome_regulatory_tracks source collection must be acquired and verified through VIPER."
depends_on = ["P4-REQ-03"]
verifier_ids = ["P4-VR-10"]

[[requirements]]
id = "P4-REQ-10C"
claim = "The chromatin_accessibility package must rebuild from its pinned sources and reproduce its historical output exactly."
depends_on = ["P4-REQ-03"]
verifier_ids = ["P4-VR-10"]

[[requirements]]
id = "P4-REQ-10D"
claim = "The depmap_essentiality package must recover or deliberately replace the missing historical DepMap gene-effect source and retain the resulting mismatch classification."
depends_on = ["P4-REQ-03"]
verifier_ids = ["P4-VR-10"]

[[requirements]]
